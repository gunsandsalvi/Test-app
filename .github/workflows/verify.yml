# §5-STRUCT — THE RATCHETS ONLY MEAN SOMETHING IF SOMETHING RUNS THEM.
#
# `check-hygiene.sh` carries three budgets (money writes outside the ledger, literal comparisons
# against an instrument type, the pure-test boundary) and each may fall and never rise. Before this
# file they fired only when a human typed `npm run verify`, which makes an architectural fitness
# function a comment with extra steps.
#
# The harness is NOT run here. It takes minutes, it currently fails (§7.233 — 1,130 violations, of
# which 237 are checks that got sharper), and a check that is always red teaches people to ignore
# the build. It stays a deliberate local run until its count is meaningful; what gates a push is
# what is fast and unambiguous: types, hygiene, unit tests.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The type check. `strict` is being turned on flag by flag (§7.234) — this fails the moment
      # a change regresses whatever is on today.
      - run: npm run lint
      # The architectural ratchets. Each budget may fall and never rise.
      - run: npm run hygiene
      # Pure-function tests over domain/. No world is run; see §2.4.
      - run: npm test
