# §5-STRUCT — THE RATCHETS ONLY MEAN SOMETHING IF SOMETHING RUNS THEM.
#
# `check-hygiene.sh` carries the budgets (literal comparisons against an instrument type, the
# pure-test boundary, the ledger's import boundaries) and each may fall and never rise. Before this
# file they fired only when a human typed `npm run verify`, which makes an architectural fitness
# function a comment with extra steps. It runs §4's five gates and nothing else.
#
# The harness is NOT run here. It takes minutes and it is DELIBERATELY red — its violations are
# the plan's unbuilt steps (rule 11), and a check that is always red teaches people to ignore the
# build. It stays a local run, and it is step 38's to move. What gates a push is what is fast and
# unambiguous: types, lint, hygiene, unit tests, build.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Types AND lint. `strict: true` is on (§7.234). The lint's `--max-warnings` is THE RATCHET
      # (§4): the `no-unnecessary-condition` backlog §9.29-ii turned on, may fall and never rise;
      # every other rule stands at zero.
      - run: npm run lint
      # The architectural ratchets (and check-atlas). Each budget may fall and never rise.
      - run: npm run hygiene
      # Pure-function tests over domain/. No world is run; see §2.4.
      - run: npm test
      # The fifth gate: the app still builds. §4 lists all five and CI runs all five.
      - run: npm run build
