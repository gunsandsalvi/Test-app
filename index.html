<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- §3.14-SHELL: the on-screen keyboard OVERLAYS the page instead of resizing it, on every
         browser that knows the keyword, so the shell can place its command bar off the visual
         viewport (Aurora.tsx) and hold everything else still. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content" />
    <title>Aurora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="theme-color" content="#12171f" />
    <meta name="description" content="Aurora — object function over a simulated world." />
    <meta property="og:title" content="Aurora" />
    <meta property="og:description" content="Dig as deep as the world allows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Grants cross-origin isolation on static hosts (GitHub Pages can't set COOP/COEP
         headers itself), which unhides SharedArrayBuffer so the worker path can run.
         Registers a service worker and reloads the page once on first visit. -->
    <script src="./coi-serviceworker.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
