plugins { id 'com.android.application' }

android {
  namespace 'com.gunsandsalvi.enginebench'
  compileSdk 34
  defaultConfig {
    applicationId 'com.gunsandsalvi.enginebench'
    minSdk 24
    targetSdk 34
    versionCode Integer.parseInt(System.getenv('APK_VERSION_CODE') ?: '1')
    versionName '1.0'
  }
  signingConfigs {
    // A self-sign key for sideloading a test bench; deliberately committed so every CI build
    // carries the same signature and installs over the previous one.
    release {
      storeFile file('../keystore.p12')
      storeType 'PKCS12'
      storePassword 'benchbench'
      keyAlias 'bench'
      keyPassword 'benchbench'
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }
}
